# QLoRA fine-tuning configuration optimized for Apple M4 Metal unified memory
model: "mlx-community/Qwen2.5-3B-Instruct-4bit"
train: true
fine_tune_type: "lora"
data: "data"

# LoRA parameter tuning
lora_parameters:
  rank: 16
  alpha: 32.0
  dropout: 0.05
  scale: 2.0

# Memory & performance settings for M4 GPU
batch_size: 4
iters: 300
val_batches: 20
learning_rate: 1e-4
steps_per_report: 25
steps_per_eval: 50
save_every: 100
adapter_path: "adapters"
max_seq_length: 512
grad_checkpoint: true
mask_prompt: true
